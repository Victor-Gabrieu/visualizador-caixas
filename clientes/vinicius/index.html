<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Denise Lins | Visualização 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #f7f5f1; font-family: Arial, sans-serif; color: #514a43; text-align: center; }
    header { padding: 32px 16px 10px; }
    h1 { font-family: Georgia, serif; font-size: 25px; font-weight: normal; letter-spacing: 2px; margin: 0; }
    p { font-size: 13px; letter-spacing: 1px; }
    model-viewer { width: 100%; height: 65vh; min-height: 400px; background: #f7f5f1; }
    #toggle-animation { margin: 12px auto; padding: 11px 22px; border: 1px solid #8b7967; border-radius: 25px; background: transparent; color: #514a43; font-size: 13px; cursor: pointer; }
    #toggle-animation:hover { background: #eae4dc; }
    #toggle-animation:disabled { opacity: .55; cursor: default; }
    #status { min-height: 18px; font-size: 12px; letter-spacing: 0; margin: 0 16px; }
    footer { padding: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <header><h1>DENISE LINS</h1><p>CONVITES &amp; PAPELARIA PERSONALIZADA</p></header>
  <model-viewer id="viewer" src="caixa.glb" alt="Modelo tridimensional da caixa personalizada" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" exposure="1" interaction-prompt="auto"></model-viewer>
  <button id="toggle-animation" type="button" disabled>Carregando animação...</button>
  <p id="status" role="status" aria-live="polite"></p>
  <audio id="musica" src="musica.m4a" loop preload="auto"></audio>
  <footer>Arraste para girar • Aproximar com dois dedos<p>Apresentação exclusiva do seu projeto</p></footer>
  <script>
    const viewer = document.querySelector('#viewer');
    const button = document.querySelector('#toggle-animation');
    const status = document.querySelector('#status');
    let duration = 0;
    let open = false;
    let moving = false;
    let animationFrame = null;
    let endTime = 0; // Último instante seguro, antes de reiniciar o loop

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    viewer.addEventListener('load', async () => {
      viewer.pause();
      viewer.currentTime = 0;
      const names = viewer.availableAnimations || [];
      if (!names.length) {
        button.textContent = 'Animação indisponível';
        status.textContent = 'O site não encontrou uma animação no arquivo caixa.glb.';
        return;
      }

      viewer.animationName = names[0];
      // Aguarda a animação selecionada ser aplicada ao visualizador.
      if (viewer.updateComplete) await viewer.updateComplete;
      for (let attempt = 0; attempt < 30; attempt++) {
        const value = Number(viewer.duration);
        if (Number.isFinite(value) && value > 0) {
          duration = value;
          break;
        }
        await wait(100);
      }

      if (!duration) {
        button.textContent = 'Animação indisponível';
        status.textContent = 'O navegador não conseguiu ler a duração da animação do GLB.';
        return;
      }
      endTime = Math.max(0, duration - Math.min(0.016, duration / 100));
      viewer.pause();
      viewer.currentTime = 0;
      status.textContent = '';
      button.disabled = false;
      button.textContent = 'Abrir caixa';
    });

    viewer.addEventListener('error', () => {
      button.disabled = true;
      button.textContent = 'Modelo indisponível';
      status.textContent = 'Não foi possível carregar caixa.glb.';
    });

    button.addEventListener('click', () => {
      if (moving || !duration) return;
      moving = true;
      button.disabled = true;
      const from = open ? endTime : 0;
      const to = open ? 0 : endTime;
      const start = performance.now();
      const animationMs = Math.abs(to - from) * 1000;
      viewer.pause();

      function tick(now) {
        const progress = Math.min((now - start) / animationMs, 1);
        viewer.currentTime = from + (to - from) * progress;
        if (progress < 1) {
          animationFrame = requestAnimationFrame(tick);
        } else {
          viewer.currentTime = to;
          viewer.pause();
          open = !open;
          moving = false;
          button.disabled = false;
          button.textContent = open ? 'Fechar caixa' : 'Abrir caixa';
        }
      }
      animationFrame = requestAnimationFrame(tick);
    });

    // Música ambiente: começa após a primeira interação permitida pelo navegador.
    const musica = document.querySelector('#musica');
    musica.volume = 0.4;
    let iniciandoMusica = false;

    function iniciarMusica() {
      if (!musica.paused || iniciandoMusica) return;
      iniciandoMusica = true;
      musica.play().then(() => {
        document.removeEventListener('pointerdown', iniciarMusica);
        document.removeEventListener('keydown', iniciarMusica);
      }).catch(() => {
        // Se o navegador bloquear ou o arquivo não estiver pronto,
        // uma próxima interação poderá tentar novamente.
      }).finally(() => {
        iniciandoMusica = false;
      });
    }

    document.addEventListener('pointerdown', iniciarMusica);
    document.addEventListener('keydown', iniciarMusica);
  </script>
</body>
</html>
