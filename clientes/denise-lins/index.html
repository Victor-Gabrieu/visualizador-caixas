
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Denise Lins Convites | Visualização 3D</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f7f5f1;
      font-family: Arial, sans-serif;
      color: #514a43;
      text-align: center;
    }

    header {
      padding: 32px 16px 10px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: normal;
      letter-spacing: 2px;
      margin: 0;
    }

    p {
      font-size: 13px;
      letter-spacing: 1px;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 400px;
      background: #f7f5f1;
    }

    footer {
      padding: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>DENISE LINS</h1>
    <p>CONVITES & PAPELARIA PERSONALIZADA</p>
  </header>

  <model-viewer
    src="caixa-denise-lins.glb"
    alt="Modelo tridimensional da caixa personalizada"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1"
    interaction-prompt="auto">
  </model-viewer>

  <footer>
    Arraste para girar • Aproximar com dois dedos
    <p>Apresentação exclusiva do seu projeto</p>
  </footer>

</body>
</html>
